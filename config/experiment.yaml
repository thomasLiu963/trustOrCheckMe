seed: 20260904

dataset:
  name: mmlu_pro
  hf_repo: TIGER-Lab/MMLU-Pro
  revision: b189ec765aa7ed75c8acfea42df31fdae71f97be
  split: test
  pilot_size: 200
  main_size: 1400
  stratify_by: category
  pilot_sample_path: data/samples/mmlu_pro_pilot.jsonl
  pilot_manifest_path: data/manifests/mmlu_pro_pilot_manifest.json
  cache_dir: data/raw/huggingface

costs:
  verification_cost: 1.0
  error_costs: [2.0, 5.0, 10.0, 20.0]

confidence:
  min: 0.0
  max: 1.0

model_inference:
  no_tools: true
  no_external_retrieval: true
  concurrency: 4
  max_transient_retries: 3
  max_parse_repairs: 1

results:
  checkpoint_path: results/raw/pilot.sqlite3
  analysis_directory: results
  paper_output_directory: paper_outputs

bootstrap:
  n_resamples: 5000
  confidence_level: 0.95

calibration:
  method: isotonic
  calibration_fraction: 0.20
